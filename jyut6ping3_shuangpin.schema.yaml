# Rime schema
# encoding: utf-8
#
# 粵拼雙拼：rime-cantonese（jyut6ping3）之上的雙拼 algebra，唔改字典。
#
# 每個音節固定兩鍵：聲母鍵 + 韻母鍵；之後可選打聲調（v=1 vv=4 x=2 xx=5 q=3 qq=6，同 jyut6ping3 一樣）。
# 聲母鍵：b p m f d t n l g k h w z c s j 照打；ng=y gw=u kw=i 零聲母=o（右手上排 y u i o）。
# 粵拼聲母唔會用 a e q r v x 開頭，所以呢六個鍵永遠唔係音節起點：
#   v x q 做聲調、x 筆畫反查，a e r 留做將來嘅輔碼（rq 日期、uq 時間由 date_time.lua 提供）。
#   U 開頭：拆字，兩套一齊出：小鶴拆字（radical_flypy，部件用小鶴碼）同粵語兩分（部件用本方案雙拼碼：林 = Umama）。[ ] 以詞定字（lua/select_character.lua）。
#
# 韻母鍵（每鍵按語料頻率排）：
#   a  ap it a
#   b  in em
#   c  au
#   d  ai ot
#   e  e ak oe
#   f  at oi et
#   g  ang aang eng
#   h  ong
#   i  i ok
#   j  an aap
#   k  ing ng
#   l  oeng aai ep
#   m  im aat ek
#   n  ik aau
#   o  o
#   p  aan ip
#   q  iu on
#   r  yun ut eu
#   s  ung
#   t  uk eot yut
#   u  u eon aak
#   v  eoi m ui
#   w  ei yu
#   x  aa
#   y  aam un oek
#   z  ou am
#
# 鍵位嚟源：同小鶴雙拼拼寫相同嘅韻母沿用小鶴鍵（ai d、an j、ei w、eng g、in b、ing k、ou z、iu q、ui v、un y），
# 讀音對應普通話嘅用小鶴對應韻母鍵（ung≈ong s、ong≈ang h、ang/aang≈eng g、au≈ao c、aa≈ia/ua x、oeng≈iang l、aau≈iao n、im≈ian m、ip≈ie p、yun≈üan r、yut≈üe t、eoi≈ü v），
# 長右短左：長音 aai aam aan aap aat aak 喺右手，短音 am ap at ak 喺左手（aa、an 係小鶴釘位，aang 跟 ang 喺 G）。
# 每鍵最多三個韻母；其餘由語料加權模擬退火排位。aai/ai、aan/an、aau/au 強制分鍵。

schema:
  schema_id: jyut6ping3_shuangpin
  name: 粵拼雙拼
  version: "0.3"
  author:
    - Nocehi
  description: |-
    粵拼雙拼（實驗版，dogfood 中）
    字典、語言模型同反查沿用 rime-cantonese 嘅 jyut6ping3。
  dependencies:
    - jyut6ping3
    - loengfan_shuangpin
    - stroke
    - radical

switches:
  - name: ascii_mode
    reset: 0
    states: [ 粵, 英 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - options: [ noop, variants_hk, trad_tw, simplification ]
    states: [ 傳統漢字, 香港傳統漢字, 臺灣傳統漢字, 大陆简化汉字 ]
    reset: 1
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - lua_processor@*select_character
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@stroke
    - affix_segmentor@radical_lookup
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@loengfan
    - table_translator@stroke
    - table_translator@radical_lookup
    - lua_translator@*date_time
  filters:
    - simplifier
    - simplifier@variants_hk
    - simplifier@trad_tw
    - uniquifier
    - reverse_lookup_filter@jyut6ping3_reverse_lookup

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # 模糊音（喺 jyut6ping3 原碼上做，所以要放最前）。取消註釋即啓用：
    #- derive/^ng([aeiou])/$1/        # 疑影交替：ng- 通 Ø-
    #- derive/^([aeiou])/ng$1/        #           Ø- 通 ng-
    #- derive/^n(?!g)/l/              # 泥來合流
    #- derive/^(g|k)wo/$1o/           # gw-/kw- 喺 o 前併入 g-/k-（國讀若各）

    # 1. 聲母 → 大寫鍵（大寫防止後面規則再改寫，最後先 xlit 轉返細階）
    - xform/^gw/U/
    - xform/^kw/I/
    - xform/^ng(?=[aeiou])/Y/
    - xform/^(m|ng)(?=\d)/O$1/        # 自成音節 m、ng：零聲母
    - xform/^([aeiou])/O$1/           # 零聲母
    - xform/^([bpmfdtnlgkhwzcsj])/\U$1\E/

    # 2. 韻母 → 大寫鍵
    - xform/^([A-Z])aang(\d?)$/$1G$2/
    - xform/^([A-Z])oeng(\d?)$/$1L$2/
    - xform/^([A-Z])aai(\d?)$/$1L$2/
    - xform/^([A-Z])aak(\d?)$/$1U$2/
    - xform/^([A-Z])aam(\d?)$/$1Y$2/
    - xform/^([A-Z])aan(\d?)$/$1P$2/
    - xform/^([A-Z])aap(\d?)$/$1J$2/
    - xform/^([A-Z])aat(\d?)$/$1M$2/
    - xform/^([A-Z])aau(\d?)$/$1N$2/
    - xform/^([A-Z])ang(\d?)$/$1G$2/
    - xform/^([A-Z])eng(\d?)$/$1G$2/
    - xform/^([A-Z])eoi(\d?)$/$1V$2/
    - xform/^([A-Z])eon(\d?)$/$1U$2/
    - xform/^([A-Z])eot(\d?)$/$1T$2/
    - xform/^([A-Z])ing(\d?)$/$1K$2/
    - xform/^([A-Z])oek(\d?)$/$1Y$2/
    - xform/^([A-Z])ong(\d?)$/$1H$2/
    - xform/^([A-Z])ung(\d?)$/$1S$2/
    - xform/^([A-Z])yun(\d?)$/$1R$2/
    - xform/^([A-Z])yut(\d?)$/$1T$2/
    - xform/^([A-Z])aa(\d?)$/$1X$2/
    - xform/^([A-Z])ai(\d?)$/$1D$2/
    - xform/^([A-Z])ak(\d?)$/$1E$2/
    - xform/^([A-Z])am(\d?)$/$1Z$2/
    - xform/^([A-Z])an(\d?)$/$1J$2/
    - xform/^([A-Z])ap(\d?)$/$1A$2/
    - xform/^([A-Z])at(\d?)$/$1F$2/
    - xform/^([A-Z])au(\d?)$/$1C$2/
    - xform/^([A-Z])ei(\d?)$/$1W$2/
    - xform/^([A-Z])ek(\d?)$/$1M$2/
    - xform/^([A-Z])em(\d?)$/$1B$2/
    - xform/^([A-Z])ep(\d?)$/$1L$2/
    - xform/^([A-Z])et(\d?)$/$1F$2/
    - xform/^([A-Z])eu(\d?)$/$1R$2/
    - xform/^([A-Z])ik(\d?)$/$1N$2/
    - xform/^([A-Z])im(\d?)$/$1M$2/
    - xform/^([A-Z])in(\d?)$/$1B$2/
    - xform/^([A-Z])ip(\d?)$/$1P$2/
    - xform/^([A-Z])it(\d?)$/$1A$2/
    - xform/^([A-Z])iu(\d?)$/$1Q$2/
    - xform/^([A-Z])ng(\d?)$/$1K$2/
    - xform/^([A-Z])oe(\d?)$/$1E$2/
    - xform/^([A-Z])oi(\d?)$/$1F$2/
    - xform/^([A-Z])ok(\d?)$/$1I$2/
    - xform/^([A-Z])on(\d?)$/$1Q$2/
    - xform/^([A-Z])ot(\d?)$/$1D$2/
    - xform/^([A-Z])ou(\d?)$/$1Z$2/
    - xform/^([A-Z])ui(\d?)$/$1V$2/
    - xform/^([A-Z])uk(\d?)$/$1T$2/
    - xform/^([A-Z])un(\d?)$/$1Y$2/
    - xform/^([A-Z])ut(\d?)$/$1R$2/
    - xform/^([A-Z])yu(\d?)$/$1W$2/
    - xform/^([A-Z])a(\d?)$/$1A$2/
    - xform/^([A-Z])e(\d?)$/$1E$2/
    - xform/^([A-Z])i(\d?)$/$1I$2/
    - xform/^([A-Z])m(\d?)$/$1V$2/
    - xform/^([A-Z])o(\d?)$/$1O$2/
    - xform/^([A-Z])u(\d?)$/$1U$2/

    # 3. 聲調可選：唔打調都得
    - derive/\d$//
    - xform/1$/V/
    - xform/4$/VV/
    - xform/2$/X/
    - xform/5$/XX/
    - xform/3$/Q/
    - xform/6$/QQ/
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/abcdefghijklmnopqrstuvwxyz/

    # 4. 聲母簡拼
    - abbrev/^([a-z]).+$/$1/

