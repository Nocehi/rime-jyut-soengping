loengfan:
  tag: radical_lookup              # 併入 U：同小鶴拆字共用前綴
  dictionary: loengfan_shuangpin   # 部件用雙拼碼，見 tools/gen_loengfan.py
  enable_user_dict: false
  enable_sentence: false
  enable_completion: true
  prefix: "U"
  tips: 〔兩分〕

stroke:
  tag: stroke
  dictionary: stroke
  prefix: "x"
  suffix: ";"
  tips: 〔筆畫〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/


radical_lookup:
  tag: radical_lookup
  dictionary: radical_flypy
  enable_sentence: false
  enable_user_dict: false
  prefix: "U"
  tips: 〔拆字〕
  comment_format:
    - erase/^.*$//

jyut6ping3_reverse_lookup:
  tags: [ stroke, radical_lookup ]
  overwrite_comment: false
  dictionary: jyut6ping3

variants_hk:
  option_name: variants_hk
  opencc_config: t2hkf.json

trad_tw:
  option_name: trad_tw
  opencc_config: t2tw.json

punctuator:
  import_preset: symbols_cantonese

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[a-z]+)$"
    stroke: "^x[hspnz]*;?$"
    radical_lookup: "^U[a-z]*'?$"
    uppercase: "[A-TV-Z][-_+.'0-9A-Za-z]*$|U[-_+.'0-9A-Z][-_+.'0-9A-Za-z]*$"

__patch:
  - grammar:/hant?
  - jyut6ping3_shuangpin.custom:/patch?
  - jyut6ping3_shuangpin.device:/patch?   # 只放喺個別裝置（例如手機改綁以詞定字鍵），唔隨打包同步
