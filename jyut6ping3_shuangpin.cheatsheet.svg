<text x="20" y="500" font-size="12" fill="#718096">長音 aai aam aan aap aat aak 在右手，短音 am ap at ak 在左手；每鍵最多三個韻母。由 tools/gen_chart.py 從 layouts JSON 生成。</text>
<text x="20" y="518" font-size="12" fill="#2d3748">助記句（Q→P、A→L、Z→M 各一字）：潮起北川月，南湖詩歌晚。熱風西來，冷江雲影涼。草花流水天色染。　橋樹斜泉竹，觀春落波灣。別夢歸海，燈光聞清唱。早茶樓裏先食點。</text>
